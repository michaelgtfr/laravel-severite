name: 🔧 Technical Task
description: Refactor, chore, tech debt, or internal task
title: "[Task] "
labels: ["task"]
assignees: []
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done?
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Rationale
      description: Why is this task needed (tech debt, performance, security, etc.)
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: false

  - type: dropdown
    id: type
    attributes:
      label: Task type
      options:
        - Refactor
        - Chore
        - Documentation
        - Performance
        - Security
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

